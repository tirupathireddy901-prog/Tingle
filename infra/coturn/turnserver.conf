# coturn configuration — self-hosted TURN relay (used only when direct
# WebRTC peer-to-peer via STUN fails). Values here are local-dev defaults;
# override via infra/coturn/turnserver.conf for production and set a real
# TURN_STATIC_AUTH_SECRET (see .env.example).

listening-port=3478
tls-listening-port=5349

# Relay port range — keep narrow to limit exposed surface
min-port=49160
max-port=49200

# Use time-limited credentials derived from a shared secret rather than
# static username/password pairs (standard coturn REST API auth mechanism).
use-auth-secret
static-auth-secret=change_me_turn_secret

realm=tingle.local
server-name=tingle.local

# Don't relay to/from loopback or link-local addresses (basic SSRF hardening)
no-loopback-peers
no-multicast-peers

# Fingerprinting + long-term credentials off since we use time-limited auth
fingerprint

# Logging — keep enough to debug relay issues, nothing about call content
# (coturn never has access to call content; only signaling metadata)
log-file=stdout
verbose

# Disable the built-in web admin (not needed, reduces attack surface)
no-cli
